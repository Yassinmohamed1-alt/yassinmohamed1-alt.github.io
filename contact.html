  <main class="main">

    <section id="contact" class="contact-module section">

      <div class="container section-title" data-aos="fade-up">
        <h2>Contact</h2>
        <p>Fill in the form and rate my CV website.</p>
      </div>

      <div class="container" data-aos="fade-up" data-aos-delay="100">

        <form id="contactForm" class="contact-form" novalidate>

          <div class="form-grid">

            <div class="form-group">
              <label for="firstName">First name</label>
              <input type="text" id="firstName" name="firstName" autocomplete="given-name" aria-describedby="firstNameError" required>
              <span class="field-error" id="firstNameError" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="lastName">Last name</label>
              <input type="text" id="lastName" name="lastName" autocomplete="family-name" aria-describedby="lastNameError" required>
              <span class="field-error" id="lastNameError" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="email">Email address</label>
              <input type="email" id="email" name="email" autocomplete="email" aria-describedby="emailError" required>
              <span class="field-error" id="emailError" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="phone">Phone number</label>
              <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="numeric" placeholder="+370 6xx xxxxx" aria-describedby="phoneError" required>
              <span class="field-error" id="phoneError" role="alert"></span>
            </div>

            <div class="form-group full">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" autocomplete="street-address" aria-describedby="addressError" required>
              <span class="field-error" id="addressError" role="alert"></span>
            </div>

            <h3 class="form-heading">Rate the website (1-10)</h3>

            <div class="form-group">
              <label for="rating1">How would you rate the design?</label>
              <input type="number" id="rating1" name="rating1" min="1" max="10" step="1" placeholder="1-10" aria-describedby="rating1Error" required>
              <span class="field-error" id="rating1Error" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="rating2">How would you rate the content?</label>
              <input type="number" id="rating2" name="rating2" min="1" max="10" step="1" placeholder="1-10" aria-describedby="rating2Error" required>
              <span class="field-error" id="rating2Error" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="rating3">How would you rate the navigation?</label>
              <input type="number" id="rating3" name="rating3" min="1" max="10" step="1" placeholder="1-10" aria-describedby="rating3Error" required>
              <span class="field-error" id="rating3Error" role="alert"></span>
            </div>

          </div>

          <div class="form-actions">
            <button type="submit" id="submitButton" class="btn btn-primary" disabled>Submit</button>
            <button type="button" id="clearButton" class="btn btn-outline">Clear</button>
          </div>

        </form>

        <div id="formResult" class="form-result" aria-live="polite" hidden></div>

      </div>

    </section>
